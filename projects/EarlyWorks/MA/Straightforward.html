<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straightforward (2025)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #3a45b4;
            color: #ffffe5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .cyanotype img {
          filter: grayscale(100%) contrast(1) blur(var(--blur));
          flex: 1 0 100%;
          height: 100%;
          max-width: 100%;
          mix-blend-mode: var(--bg-blend);
          object-fit: cover;
          opacity:  var(--opacity);
          position: relative;
          width: 100%;
        }
        /* add to your existing <style> */
        #choice-image-container {
          margin: 10px 0 16px;
          display: flex;
          justify-content: center;
          align-items: center;
        }
        #choice-image-container img {
          max-width: 100%;
          height: auto;
          border-radius: 6px;
          box-shadow: 0 6px 18px rgba(0,0,0,0.35);
          transition: transform .12s ease;
          cursor: zoom-in;
        }
        #choice-image-container .caption {
          width: 100%;
          text-align: center;
          margin-top: 6px;
          font-size: .9rem;
          color: rgba(255,255,229,.9);
        }
        .game-container {
            width: 80%;
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            text-align: center;
        }
        .story-text {
            margin-bottom: 20px;
            delay: .3s;
        }
        .choices {
            display: flex;
            flex-direction: column;
            delay: .3s;
        }
        .choice-button {
            background-color: inherit;
            color: inherit;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .choice-button:hover {
            background-color: #243670;
            delay: .3s;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="story-text" id="story-text"></div>
        <div class="cyanotype" id="choice-image-container" aria-hidden="true"></div>
        <div class="choices" id="choices"></div>
    </div>
    <script>
        // Safe helper: remove all children from an element (no innerHTML)
        function clearElement(el) {
          while (el.firstChild) el.removeChild(el.firstChild);
        }
        
        // Insert a choice image into the dedicated container.
        // opts: { src, alt, caption, id, className, loading='lazy' }
        function showChoiceImage(opts = {}) {
          const container = document.getElementById('choice-image-container');
          if (!container) return;
        
          // remove any existing image
          clearElement(container);
        
          if (!opts || !opts.src) return; // nothing to show
        
          const wrapper = document.createElement('div');
          wrapper.className = opts.className || 'choice-image-wrap';
        
          const img = document.createElement('img');
          img.setAttribute('src', opts.src);
          img.setAttribute('alt', opts.alt || '');
          img.loading = opts.loading || 'lazy';
          if (opts.id) img.id = opts.id;
        
          // optional caption
          if (opts.caption) {
            const cap = document.createElement('div');
            cap.className = 'caption';
            cap.textContent = opts.caption;
            wrapper.appendChild(img);
            wrapper.appendChild(cap);
          } else {
            wrapper.appendChild(img);
          }
        
          container.appendChild(wrapper);
        }
        
        // Remove any displayed choice image
        function hideChoiceImage() {
          const container = document.getElementById('choice-image-container');
          if (!container) return;
          clearElement(container);
        }
        
        // Defining story and choices
        //game will load page of specific funciton, so choices can be rhizomatic
        const story = {
            start: {
                text: "Midway upon the journey of our life, I found myself within a forest dark, for the straightforward pathway had been lost...",
                choices: [
                    { text: "Yet, at the turn of each passing day, I lay knowing tomorrow, oh, tomorrow; the room, the same.", next: "wall" },
                    { text: "The hum bekons me. Yes, that hum in the walls, the gadgets, the outlets. The spirit that moves through all things.", next: "hum" }
                ]
            },
            wall: {
                text: "It will be sunrise soon. My body can sense it. I'm lucid. so much so I am in competition with the sun. Are these premonitions to the inevitable? This is the start to the rest of my life.",
                choices: [
                    { text: "Investigate the bushes.", next: "end" }
                ]
            },
            hum: {
                text: "This hum, I imagine, is what the plants so low and high feel from the sun. It's scorching, but tender. I too am low, but not quite digging my heals into the earth, like the plants are. How amazing is it to be here as the same moment as them. This is the start to the rest of my life.",
                // image: { src: "assets/images/stone.jpg", alt: "small stone", caption: "A strange smooth stone." }
                choices: [
                    { text: "Head towards the village.", next: "end" }
                ]
            },
            end: {
                text: "These are the same as the pictures in my head of the final destination.",
                choices: [
                    { text: "If I could do everything over, I would.", next: "start" },
                    { text: "Despite everything, I wouldn't change anything.", next: "credits" }
                ]
            },
            credits: {
                text: "Straightforward (2025), by Orchid Sylvester. Inspired by my fellowship experience the previous summer at Peters Valley School of Craft. Created as the final project for MSTU 5003 + 5013 Theory of Programming Lecture and Lab at Teacher's College, Columbia University."
            }
        };

        // Initialize the game
        let currentLocation = "start";

        // Function to update the story and choices
        function updateGame() {
            const currentStory = story[currentLocation];
            document.getElementById("story-text").innerText = currentStory.text;

            // Update the choices
            const choicesContainer = document.getElementById("choices");
            choicesContainer.innerHTML = "";
            currentStory.choices.forEach(choice => {
                const button = document.createElement("button");
                button.innerText = choice.text;
                button.classList.add("choice-button");
                button.onclick = () => {
                  // show image if the choice includes one
                  if (choice.image) {
                    showChoiceImage(choice.image);
                    // optionally do not navigate away so player can view the image:
                    // return; // keep on same node
                  } else {
                    hideChoiceImage();
                  }
                
                  // then navigate to next node
                  currentLocation = choice.next;
                  updateGame();
                };
                };
                choicesContainer.appendChild(button);
            });
        }

        // Start the game
        updateGame();
    </script>
</body>
</html>
